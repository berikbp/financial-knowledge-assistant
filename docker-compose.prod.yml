services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: financial-rag-qdrant-prod
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: financial-rag-api-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      HF_HOME: /app/cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/cache/sentence-transformers
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      RERANKER_MODEL_NAME: BAAI/bge-reranker-v2-m3
      ENABLE_RERANKER: 0

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: financial-rag-frontend-prod
    restart: unless-stopped
    ports:
      - "5500:5500"
    depends_on:
      - api
